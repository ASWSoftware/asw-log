name: Test Report

# Publishes the JUnit results that ci.yml uploads as one check run per CI matrix entry.
#
# This is a separate workflow, instead of a step in ci.yml, because CI for a pull request from a fork runs with a
# read-only token that can't create check runs. A workflow_run workflow runs in this repository's context with the
# permissions below. It only reads the uploaded XML artifacts; it never checks out or runs the pull request's code.
#
# workflow_run only triggers from the copy of this file on the default branch (main), so changes to it take effect
# once merged there.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  report:
    name: Publish test results
    runs-on: ubuntu-latest
    # A cancelled CI run (e.g. superseded by a newer push) has nothing complete to report.
    if: github.event.workflow_run.conclusion != 'cancelled'
    steps:
      - name: Report test results
        uses: dorny/test-reporter@v3
        with:
          # One artifact per matrix entry, e.g. "test-results-Linux (GCC)" -> check run "Test Results - Linux (GCC)".
          artifact: /test-results-(.*)/
          name: Test Results - $1
          path: '*.xml'
          reporter: java-junit
          # Failed tests already fail CI and mark their check run as failed; this workflow only fails if publishing
          # itself does.
          fail-on-error: false
          # A CI run that failed before its tests ran uploads nothing; CI already reports that failure, and CI's
          # upload step fails if the tests ran without writing a report.
          fail-on-empty: false
